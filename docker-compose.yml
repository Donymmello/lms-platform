# Service names are prefixed because Docker's DNS answers by service name on
# every network a container joins. A service called `frontend` or `postgres`
# will collide, silently, with the same generic name in any other project the
# moment a shared proxy is attached to both networks — the proxy asks for
# `frontend` and gets whichever container answers first. That took a live site
# down once; see "Se a VPS já serve outros sites" in the README.
#
# No `container_name:` anywhere on purpose. A fixed name is global to the
# Docker daemon, so the stack refuses to start if any other project — or a
# leftover container from an older version of this one — already holds it
# ("Conflict. The container name /lms_mailpit is already in use"). Compose
# generates `<projecto>-<serviço>-1` instead, which is unique per project and
# per instance. Address containers through compose (`docker compose exec
# lms-backend ...`), never by a hand-written name.

services:
  # --- BANCO DE DADOS (PostgreSQL) ---
  lms-postgres:
    # Pinned to a specific major version on purpose: the floating `:alpine`
    # tag now resolves to Postgres 18+, which changed its on-disk data
    # layout (pg_ctlcluster-style) and refuses to start against a volume
    # created by an older major version. Pinning avoids that class of
    # breakage entirely and keeps the image reproducible across machines.
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
    ports:
      # Host-side only, for psql/Adminer from outside Docker. The backend
      # reaches Postgres as `lms-postgres:5432` over the compose network, so this
      # can be any free host port — 5432 itself is often taken by another
      # project's database.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- GERENCIADOR DO BANCO (Adminer) ---
  lms-adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - lms-postgres

  # --- MAIL CATCHER (dev only) ---
  # Accepts every message the backend sends and shows it at
  # http://localhost:8025 instead of delivering it. Nothing leaves the
  # machine, so testing signup and payment emails needs no real mailbox and
  # cannot accidentally write to a customer.
  lms-mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # --- BACKEND (Node.js + Express + Prisma) ---
  lms-backend:
    # Named explicitly so the development and production files do not overwrite
    # each other's images. Without this both build to the same tag, and a
    # `up -d` after building the other one silently runs the wrong target —
    # the production command against a bind mount with no `dist/` in it.
    image: lms-platform-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: always
    ports:
      # Overridable because 5000 is a popular number: another project on the
      # same machine holding it makes this one fail to start with nothing but
      # "port is already allocated" to go on. Change BACKEND_HOST_PORT in .env
      # and NEXT_PUBLIC_API_URL to match, since the browser talks to this port
      # directly in development.
      - "${BACKEND_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@lms-postgres:5432/${POSTGRES_DB:-lms_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_only_access_secret_please_change_in_prod_32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_only_refresh_secret_please_change_in_prod_32}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Defaults to the dev mail catcher. Point these at a real SMTP server
      # (Gmail, cPanel, Resend, SendGrid) to actually deliver mail.
      # Dev-only default. Generate a fresh one for any real deployment.
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-6465765f6f6e6c795f6b65795f6e6f745f666f725f70726f64756374696f6e21}
      SMTP_HOST: ${SMTP_HOST:-lms-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-LMS <nao-responder@localhost>}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Used to build absolute return/webhook URLs handed to payment
      # gateways. PUBLIC_API_URL in particular must be reachable from the
      # public internet for webhooks to arrive — localhost only works once
      # you're testing through a tunnel (e.g. ngrok) or a real deployment.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PAYSUITE_BASE_URL: ${PAYSUITE_BASE_URL:-https://paysuite.tech/api/v1}
      PAYSUITE_API_KEY: ${PAYSUITE_API_KEY:-}
      PAYSUITE_WEBHOOK_SECRET: ${PAYSUITE_WEBHOOK_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      PAYPAL_MZN_PER_USD_RATE: ${PAYPAL_MZN_PER_USD_RATE:-64}
      BUNNY_STREAM_BASE_URL: ${BUNNY_STREAM_BASE_URL:-https://video.bunnycdn.com}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_STREAM_TOKEN_AUTH_KEY: ${BUNNY_STREAM_TOKEN_AUTH_KEY:-}
      BUNNY_STREAM_TOKEN_TTL_SECONDS: ${BUNNY_STREAM_TOKEN_TTL_SECONDS:-3600}
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Lesson videos when Bunny is not configured. Named so they survive the
      # container being recreated.
      - backend_uploads:/app/uploads
    depends_on:
      lms-postgres:
        condition: service_healthy

  # --- FRONTEND (Next.js App Router) ---
  lms-frontend:
    # Named explicitly so the development and production files do not overwrite
    # each other's images. Without this both build to the same tag, and a
    # `up -d` after building the other one silently runs the wrong target —
    # the production command against a bind mount with no `dist/` in it.
    image: lms-platform-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # The source is a Windows bind mount, and inotify events do not cross it
      # into the container: without polling, webpack never learns a file changed
      # and keeps serving whatever it compiled at startup.
      WATCHPACK_POLLING: "true"
      # Compiled into the browser bundle, so it has to be an address the
      # *visitor's* browser can reach — not one that only resolves on this
      # machine. Behind a tunnel, set NEXT_PUBLIC_API_URL in .env to the
      # public origin plus /api/v1.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      # Used only for server-side fetches (Server Components,
      # generateMetadata). Inside Docker, `localhost` from the frontend
      # container is the frontend container itself — the backend is only
      # reachable at its service name on the compose network.
      INTERNAL_API_URL: http://lms-backend:5000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - lms-backend

volumes:
  postgres_data:
  backend_uploads:
