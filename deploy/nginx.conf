## One origin in front of the two services, so everything the browser sees —
## the app and the API — is the same scheme, host and port.
##
## This exists so the tunnel does not have to do the routing. A Cloudflare
## quick tunnel takes a single --url and has no ingress rules, and two separate
## trycloudflare hostnames would break the session cookies (SameSite=Lax, and
## two subdomains of a public-suffix domain are separate sites). Point any
## tunnel at this one port and both halves work.

upstream app {
    server frontend:3000;
}

upstream api {
    server backend:5000;
}

server {
    listen 8090;
    server_name _;

    ## Lesson videos are capped at 500MB by the upload middleware; give the
    ## proxy headroom over that rather than exactly that. Without this, nginx
    ## refuses anything over 1MB with a 413 that looks like an app bug.
    client_max_body_size 600m;

    ## Trust what the tunnel says about the original request. Express reads
    ## these to know the client was on HTTPS, which matters for cookies.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $http_upgrade;

    ## The API. The trailing state matters: /api/v1/... must arrive at the
    ## backend unchanged, because that is where its routes actually live.
    location /api/ {
        proxy_pass http://api;

        ## Stream uploads and video straight through instead of spooling them
        ## to disk first. Buffering a 500MB upload, then a Range request for a
        ## video, is both slow and pointless here.
        proxy_request_buffering off;
        proxy_buffering         off;

        ## A big upload over a slow connection takes a while and must not be
        ## cut off mid-way.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        client_body_timeout   600s;
    }

    ## Everything else is the Next.js app.
    location / {
        proxy_pass http://app;
        proxy_read_timeout 120s;
    }
}
